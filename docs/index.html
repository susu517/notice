<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学院信息筛选助手</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: #f0f3f8; color: #333; padding-bottom: 50px; }
        .header { background: linear-gradient(135deg, #0a1628, #1b356b); color: #fff; padding: 35px 20px; text-align: center; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; box-shadow: 0 4px 15px rgba(10, 22, 40, 0.3); }
        .header h1 { font-size: 26px; margin-bottom: 8px; letter-spacing: 1px; }
        .header p { font-size: 14px; color: #8eb4f0; }
        .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .tab { padding: 8px 18px; background: #fff; border-radius: 20px; font-size: 14px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.05); white-space: nowrap; color: #555; transition: all 0.2s; }
        .tab.active { background: #0a1628; color: #fff; font-weight: bold; box-shadow: 0 4px 10px rgba(10, 22, 40, 0.3); }
        .card { background: #fff; border-radius: 12px; padding: 22px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); position: relative; overflow: hidden; }
        .card::before { content: ''; position: absolute; left: 0; top: 20px; bottom: 20px; width: 5px; background: #1b356b; border-radius: 0 4px 4px 0; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .tag-cat { background: #e6f0ff; color: #0a1628; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; }
        .tag-tags { display: flex; gap: 6px; }
        .tag-item { background: #f1f3f4; color: #666; padding: 4px 8px; border-radius: 6px; font-size: 12px; }
        .score { color: #fbbc04; font-size: 16px; }
        .title { font-size: 18px; font-weight: bold; margin-bottom: 12px; line-height: 1.5; color: #0a1628; }
        .summary { font-size: 14px; color: #555; margin-bottom: 15px; background: #f8faff; padding: 12px; border-radius: 8px; border-left: 3px solid #8eb4f0; }
        .meta { font-size: 13px; color: #888; margin-bottom: 12px; display: flex; gap: 15px; }
        .meta span::before { content: '•'; margin-right: 5px; }
        .points { font-size: 14px; color: #333; margin-bottom: 15px; padding-left: 20px; }
        .points li { margin-bottom: 6px; line-height: 1.5; }
        .footer { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #aaa; border-top: 1px solid #eee; padding-top: 12px; margin-top: 10px; }
        .link { color: #1b356b; text-decoration: none; font-weight: bold; }
        .empty { text-align: center; padding: 60px 0; color: #999; font-size: 15px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎓 学院信息筛选助手</h1>
        <p>由 AI 大模型为您自动提炼校园通知</p>
    </div>
    <div class="container">
        <div class="tabs" id="tabs">
            <div class="tab active" data-cat="全部">全部</div>
            <div class="tab" data-cat="竞赛">竞赛</div>
            <div class="tab" data-cat="教务考试">考试</div>
            <div class="tab" data-cat="讲座报告">讲座</div>
            <div class="tab" data-cat="评奖资助">评奖</div>
        </div>
        <div id="list"></div>
    </div>
    <script>
        let allData = []; let currentCat = '全部';
        fetch('./notices.json').then(res => res.json()).then(data => { allData = data || []; render(); }).catch(err => { document.getElementById('list').innerHTML = '<div class="empty">暂无数据，请等待系统抓取...</div>'; });
        document.getElementById('tabs').addEventListener('click', (e) => {
            if (e.target.classList.contains('tab')) {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                e.target.classList.add('active'); currentCat = e.target.getAttribute('data-cat'); render();
            }
        });
        function render() {
            const list = document.getElementById('list');
            const filtered = currentCat === '全部' ? allData : allData.filter(item => item.category && item.category.includes(currentCat));
            if (filtered.length === 0) { list.innerHTML = '<div class="empty">该分类下暂无通知</div>'; return; }
            list.innerHTML = filtered.map(item => `
                <div class="card">
                    <div class="card-header">
                        <div style="display:flex; gap:8px; align-items:center;">
                            <span class="tag-cat">${item.category || '其他'}</span>
                            <div class="tag-tags">${(item.custom_tags || []).map(t => `<span class="tag-item">#${t}</span>`).join('')}</div>
                        </div>
                        <span class="score">${'★'.repeat(item.score || 0)}${'☆'.repeat(5 - (item.score || 0))}</span>
                    </div>
                    <div class="title">${item.title}</div>
                    <div class="summary">${item.summary || '暂无摘要'}</div>
                    <div class="meta"><span>来源: ${item.site || '未知'}</span><span>时间: ${item.event_time || '未提及'}</span></div>
                    <ul class="points">${(item.key_points || []).map(p => `<li>${p}</li>`).join('')}</ul>
                    <div class="footer"><span>抓取于 ${item.published_at || '近期'}</span><a href="${item.url}" target="_blank" class="link">查看原文 →</a></div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
